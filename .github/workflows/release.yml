name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/ard-plus-dl${ext}" ./cmd/ard-plus-dl

      - name: Package archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          safe_tag="${TAG//\//-}"
          archive="ard-plus-dl_${safe_tag}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -q "${archive}.zip" ard-plus-dl.exe)
            rm -f dist/ard-plus-dl.exe
          else
            tar -czf "dist/${archive}.tar.gz" -C dist ard-plus-dl
            rm -f dist/ard-plus-dl
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'dist-*'
          merge-multiple: true
          path: dist

      - name: Generate changelog
        run: |
          set -euo pipefail
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} does not exist; create and push it first." >&2
            exit 1
          fi
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            range="${previous}..${TAG}"
            compare="https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}"
          else
            range="${TAG}"
            compare=""
          fi
          {
            echo "# Änderungen in ${TAG}"
            echo
            echo "_$(date -u +%Y-%m-%d)_"
            echo
            git log "${range}" --no-merges --pretty=format:'- %s (`%h`)'
            if [ -n "$compare" ]; then
              echo
              echo
              echo "**Vollständiger Diff:** ${compare}"
            fi
          } > dist/CHANGELOG.md

      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          for file in *; do
            [ "$file" = "checksums.txt" ] && continue
            sha256sum "$file"
          done > checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file dist/CHANGELOG.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file dist/CHANGELOG.md
          fi
