# Linter configuration for golangci-lint v2.
#
# The set is deliberately small: every linter here has to pass without a
# per-file exception list, so a new finding is a real change and not noise.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused

  settings:
    errcheck:
      # Writing a prompt or a log line cannot fail in a way the program could
      # react to.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
    staticcheck:
      checks:
        - all
        # The messages of this tool are shown to the user, in German and
        # with a capital letter. They are not Go API errors.
        - "-ST1005"
        # The package and the identifier names follow the project, not the
        # style guide of the standard library.
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        # The quickfix checks only restate the code in another way.
        - "-QF1001"
        - "-QF1002"

  exclusions:
    rules:
      # The error of a Close on a file that is only read, or that is closed
      # in a defer, cannot be handled in any useful way.
      - linters:
          - errcheck
        text: "Error return value of .*\\.Close"

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
